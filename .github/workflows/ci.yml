name: Backend CI

on:
  pull_request: { }
  push:
    branches: [ develop, staging, main ]

permissions:
  contents: read

defaults:
  run:
    shell: bash

# PRs share a group by PR number. Push runs each get a distinct group,
# so publishing one develop commit cannot cancel another develop commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  LOCAL_IMAGE: backend-ci:${{ github.sha }}

jobs:
  verify:
    name: Backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    outputs:
      image_id: ${{ steps.build.outputs.image_id }}
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/ci_placeholder
      SPRING_DATASOURCE_USERNAME: test
      SPRING_DATASOURCE_PASSWORD: test
      # Set true after real Flyway migrations have been added.
      REQUIRE_MIGRATIONS: 'false'

    steps:

      - name: Validate promotion source
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          SOURCE_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          expected=""
          case "$BASE" in
            staging) expected=develop ;;
            main) expected=staging ;;
          esac

          if [[ -n "$expected" ]]; then
            if [[ "$HEAD" != "$expected" || "$SOURCE_REPO" != "$GITHUB_REPOSITORY" ]]; then
              echo "::error::PR into $BASE must come from $expected in $GITHUB_REPOSITORY; received $SOURCE_REPO:$HEAD."
              exit 1
            fi
          fi

      - name: Checkout source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Check format, compile, test and package
        run: bash ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: backend-test-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build candidate image once
        id: build
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop'
        run: |
          docker build --pull --platform linux/amd64 \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$LOCAL_IMAGE" .

          docker image inspect --format '{{.Id}}' "$LOCAL_IMAGE" > image-id.txt
          git rev-parse 'HEAD^{tree}' > source-tree.txt
          printf 'image_id=%s\n' "$(cat image-id.txt)" >> "$GITHUB_OUTPUT"

      - name: Save candidate image before smoke test
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          docker save --output image.tar "$LOCAL_IMAGE"
          sha256sum image.tar > image.tar.sha256

      - name: Smoke test the image against a fresh PostgreSQL database
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        env:
          VERIFIED_IMAGE_ID: ${{ steps.build.outputs.image_id }}
        run: |
          docker network create ci-smoke
          docker run --detach --name ci-postgres --network ci-smoke \
            --env POSTGRES_DB=ci_smoke \
            --env POSTGRES_USER=ci_user \
            --env POSTGRES_PASSWORD=ci_test_password \
            postgres:17

          # No volume or published database port: every run starts with a new DB.
          database_ready=false
          for attempt in $(seq 1 30); do
            if docker exec ci-postgres pg_isready -U ci_user -d ci_smoke > /dev/null 2>&1; then
              database_ready=true
              break
            fi
            sleep 2
          done
          if [[ "$database_ready" != true ]]; then
            echo "::error::Fresh PostgreSQL database did not become ready."
            exit 1
          fi

          docker run --detach --name ci-backend --network ci-smoke \
            --publish 127.0.0.1:18080:8080 \
            --env SERVER_PORT=8080 \
            --env SPRING_PROFILES_ACTIVE=staging \
            --env SPRING_DATASOURCE_URL=jdbc:postgresql://ci-postgres:5432/ci_smoke \
            --env SPRING_DATASOURCE_USERNAME=ci_user \
            --env SPRING_DATASOURCE_PASSWORD=ci_test_password \
            --env SPRING_FLYWAY_ENABLED=true \
            "$VERIFIED_IMAGE_ID"

          application_ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 3 \
              http://127.0.0.1:18080/actuator/health > health.json; then
              if jq -e '.status == "UP"' health.json > /dev/null; then
                application_ready=true
                break
              fi
            fi
            if [[ "$(docker inspect --format '{{.State.Running}}' ci-backend)" != true ]]; then
              echo "::error::Backend container exited before becoming healthy."
              exit 1
            fi
            sleep 2
          done
          if [[ "$application_ready" != true ]]; then
            echo "::error::Backend did not report health UP."
            exit 1
          fi

          migration_check="not-required"
          if [[ "$REQUIRE_MIGRATIONS" == true ]]; then
            applied="$(docker exec ci-postgres psql -U ci_user -d ci_smoke -Atc \
              'SELECT count(*) FROM public.flyway_schema_history WHERE success AND version IS NOT NULL;')"
            if [[ ! "$applied" =~ ^[0-9]+$ ]] || (( applied < 1 )); then
              echo "::error::Expected successful versioned Flyway migrations on the fresh database."
              exit 1
            fi
            migration_check="versioned-migrations-present"
          fi

          jq -n --arg migrationCheck "$migration_check" \
            '{passed: true, kind: "backend-startup", freshDatabase: true,
              databaseImage: "postgres:17", health: "UP",
              migrationCheck: $migrationCheck}' > smoke-result.json

      - name: Smoke diagnostics and cleanup
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/develop'
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [[ "$JOB_STATUS" != success ]]; then
            docker logs ci-backend || true
            docker logs ci-postgres || true
          fi
          docker rm --force ci-backend ci-postgres > /dev/null 2>&1 || true
          docker network rm ci-smoke > /dev/null 2>&1 || true

      - name: Upload tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: backend-tested-image
          path: |
            image.tar
            image.tar.sha256
            image-id.txt
            source-tree.txt
            smoke-result.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    name: Publish backend image
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.release.outputs.image }}
      digest: ${{ steps.release.outputs.digest }}
      commit: ${{ steps.release.outputs.commit }}
      release_artifact_id: ${{ steps.release_artifact.outputs.artifact-id }}

    steps:
      - name: Download tested image
        uses: actions/download-artifact@v8.0.2
        with:
          name: backend-tested-image
          path: image/

      - name: Load exactly the tested image
        id: load
        env:
          EXPECTED_IMAGE_ID: ${{ needs.verify.outputs.image_id }}
        run: |
          cd image
          sha256sum --check image.tar.sha256
          jq -e '.passed == true' smoke-result.json > /dev/null

          docker load --input image.tar

          expected="$EXPECTED_IMAGE_ID"
          if [[ "$(cat image-id.txt)" != "$expected" ]]; then
            echo "::error::Artifact metadata differs from the verify job output."
            exit 1
          fi
          actual="$(docker image inspect --format '{{.Id}}' "$LOCAL_IMAGE")"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Loaded image differs from the tested image."
            exit 1
          fi

          printf 'image_id=%s\n' "$actual" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" |
            docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Push tested image and write release manifest
        id: release
        env:
          VERIFIED_IMAGE_ID: ${{ steps.load.outputs.image_id }}
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          run_tag="run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          commit_tag="sha-${GITHUB_SHA}"
          run_image="$repository:$run_tag"
          commit_image="$repository:$commit_tag"

          # The unique run tag prevents a rerun of the same SHA from racing
          # with digest resolution. The SHA tag remains a lookup alias.
          docker tag "$VERIFIED_IMAGE_ID" "$run_image"
          docker push "$run_image"

          digest=""
          for attempt in $(seq 1 6); do
            if manifest="$(docker buildx imagetools inspect "$run_image" --format '{{json .Manifest}}')"; then
              if candidate="$(printf '%s' "$manifest" | jq -er '.digest')"; then
                if [[ "$candidate" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                  digest="$candidate"
                  break
                fi
              fi
            fi
            sleep 3
          done

          if [[ -z "$digest" ]]; then
            echo "::error::Cannot resolve the pushed image digest from GHCR."
            exit 1
          fi

          docker tag "$VERIFIED_IMAGE_ID" "$commit_image"
          docker push "$commit_image"

          image_ref="$repository@$digest"
          mkdir -p release
          jq -n \
            --arg component "backend" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$GITHUB_SHA" \
            --arg sourceBranch "$GITHUB_REF_NAME" \
            --arg sourceTree "$(cat image/source-tree.txt)" \
            --arg image "$image_ref" \
            --arg digest "$digest" \
            --arg tag "$run_tag" \
            --arg commitTag "$commit_tag" \
            --arg imageId "$VERIFIED_IMAGE_ID" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg runUrl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg createdAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --slurpfile smoke image/smoke-result.json \
            '{
              schemaVersion: 1,
              component: $component,
              repository: $repository,
              commit: $commit,
              sourceTree: $sourceTree,
              sourceBranch: $sourceBranch,
              image: $image,
              digest: $digest,
              tag: $tag,
              commitTag: $commitTag,
              imageId: $imageId,
              platform: "linux/amd64",
              runId: $runId,
              runAttempt: $runAttempt,
              runUrl: $runUrl,
              createdAt: $createdAt,
              smokeTest: $smoke[0]
            }' > release/release.json

          {
            printf 'image=%s\n' "$image_ref"
            printf 'digest=%s\n' "$digest"
            printf 'commit=%s\n' "$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"

          {
            printf 'Published backend image\n\n'
            printf 'Commit: %s\n\n' "$GITHUB_SHA"
            printf 'Image: %s\n\n' "$image_ref"
            printf 'Release manifest: release-backend artifact\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release manifest
        id: release_artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-backend
          path: release/release.json
          if-no-files-found: error
          retention-days: 30

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
