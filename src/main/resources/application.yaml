server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: hotel-booking-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false

  swagger-ui:
    enabled: false