server:
  port: ${SERVER_PORT:8080}

app:
  pagination:
    default-size: 20
    max-size: 100

spring:
  application:
    name: hotel-booking-backend
  config:
    import: "optional:file:./.env[.properties]"

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8

    properties:
      "[mail.smtp.auth]": ${MAIL_SMTP_AUTH:false}
      "[mail.smtp.starttls.enable]": ${MAIL_STARTTLS_ENABLE:false}
      "[mail.smtp.starttls.required]": ${MAIL_STARTTLS_REQUIRED:false}
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 3000
      "[mail.smtp.writetimeout]": 5000

auth:
  verification-ttl: PT24H
  verification-resend-cooldown: PT1M
  verification-url: ${AUTH_VERIFICATION_URL}
  mail-from: ${AUTH_MAIL_FROM}

  refresh-ttl: P7D

  jwt:
    issuer: https://hotel-booking.local
    audience: hotel-booking-api
    access-ttl: PT15M
    secret-base64: ${AUTH_JWT_SECRET_BASE64}

  register:
    max-requests: 5
    window-seconds: 60

  password-reset-url: ${AUTH_PASSWORD_RESET_URL}
  password-reset-ttl: PT15M
  password-reset-cooldown: PT1M

management:
  endpoints:
    web:
      exposure:
        include: health

  health:
    mail:
      enabled: false

  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false

  swagger-ui:
    enabled: false
